name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest   # no 3.9 build for Apple-silicon runners
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only)
        run: python -m unittest -v
      - name: MCP server tests with mcp installed
        if: matrix.python != '3.9'   # the mcp package needs Python 3.10+
        run: |
          python -m pip install "mcp>=1.2"
          python -m unittest tests.test_mcp_server -v

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin and marketplace
        run: npx --yes @anthropic-ai/claude-code plugin validate .
