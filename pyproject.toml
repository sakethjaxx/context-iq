[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contextiq"
version = "0.2.0"
description = "Live context-health meter for AI sessions — know when your session is degrading before it does."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "sakethjaxx" }]
keywords = ["claude", "claude-code", "statusline", "context-window", "tokens", "llm", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
# Core (statusline + meter) is stdlib-only so the status line starts fast.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
watch = ["rich>=13.7.0"]
chat = [
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "groq>=0.11.0",
    "anthropic>=0.40.0",
    "openai>=1.40.0",
]
all = ["contextiq[mcp,watch,chat]"]
dev = ["contextiq[all]", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/sakethjaxx/context-iq"
Issues = "https://github.com/sakethjaxx/context-iq/issues"

[project.scripts]
contextiq = "contextiq.cli:main"
contextiq-statusline = "contextiq.statusline:main"
contextiq-mcp = "contextiq.mcp_server:main"
contextiq-watch = "contextiq.watch:main"
contextiq-setup = "contextiq.install:main"

[tool.setuptools]
packages = ["contextiq"]
